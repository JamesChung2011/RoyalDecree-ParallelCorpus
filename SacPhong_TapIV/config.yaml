# STEP 2 PILOT — preserves Step 1 crop coordinates
book_name: Sac_phong_Tap_IV
pdf_path: source.pdf
layout_type: SAC_PHONG_MIXED
output_dir: output
book_code: PILOT
ocr:
  dpi: 220
  vi_engine: tesseract
  # Chinese OCR: compare preprocessing variants without overwriting the baseline.
  han_variants: [original, clahe, gray_upscaled, ink_threshold]
  # Optional comparison only; requires chi_tra or chi_tra_vert Tesseract data.
  han_compare_tesseract: true
  # Tesseract default location on Windows; change only if installed elsewhere
  # tesseract_path: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  han_rotation: clockwise
  # The second decree on page 8 is written roughly horizontally.
  # 'none' is an experiment, not a verified fix to Hán character recognition.
  han_rotation_overrides:
    PILOT.008.02: none
